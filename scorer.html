<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Scorer | GMRCRIX</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <a class="logo" href="index.html">
    GMR<span>CRIX</span>
  </a>

  <nav>
    <a id="publicLink">Public Live</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main class="container">

  <section class="card">

    <div class="live">● LIVE MATCH CENTER</div>

    <h1 id="title">Loading...</h1>

    <p id="inningsTitle" class="muted"></p>

    <div class="stats">

      <div class="stat">
        Score
        <b id="score">0/0</b>
      </div>

      <div class="stat">
        Run Rate
        <b id="rr">0.00</b>
      </div>

      <div class="stat">
        Target
        <b id="target">—</b>
      </div>

    </div>

  </section>


  <div class="scoregrid">

    <section class="card">

      <h2>Players & Settings</h2>

      <label>
        Striker
        <select id="striker"></select>
      </label>

      <label>
        Non-striker
        <select id="nonStriker"></select>
      </label>

      <label>
        Bowler
        <select id="bowler"></select>
      </label>

      <button id="savePlayers">
        Save Settings
      </button>

      <p id="overText" class="notice">
        This over: —
      </p>

      <div class="row">
        <button id="pauseMatch" class="secondary">
          Pause
        </button>

        <button id="resumeMatch" class="success">
          Resume
        </button>
      </div>

    </section>


    <section class="card">

      <h2>Ball-by-ball Engine</h2>

      <div class="buttons">

        <button data-run="0">0</button>
        <button data-run="1">1</button>
        <button data-run="2">2</button>
        <button data-run="3">3</button>
        <button data-run="4">4</button>
        <button data-run="6">6</button>

        <button id="wide">WD</button>
        <button id="noBall">NB</button>
        <button id="bye">BYE</button>
        <button id="legBye">LB</button>

        <button id="wicket" class="accent">
          WICKET
        </button>

        <button id="undo">
          UNDO
        </button>

      </div>

      <div class="row" style="margin-top:12px">

        <button id="endInnings" class="danger">
          End Innings
        </button>

        <button id="endMatch" class="danger">
          End Match
        </button>

      </div>

    </section>

  </div>


  <div class="grid">

    <section class="card">
      <h2>Batting</h2>
      <div id="battingStats"></div>
    </section>

    <section class="card">
      <h2>Bowling</h2>
      <div id="bowlingStats"></div>
    </section>

  </div>


  <section class="card">

    <h2>Live Commentary</h2>

    <div id="commentary" class="commentary"></div>

  </section>

</main>


<!-- =========================
     WICKET MODAL
========================= -->

<div id="modal" class="modal hidden">

  <div class="card wicket-modal">

    <h2 id="modalTitle">
      Wicket
    </h2>

    <div id="modalBody"></div>

    <div class="row">

      <button id="modalConfirm">
        Confirm Wicket
      </button>

      <button id="modalCancel" class="secondary">
        Cancel
      </button>

    </div>

  </div>

</div>


<script type="module" src="js/scorer.js"></script>

</body>
</html>
