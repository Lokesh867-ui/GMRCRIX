<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>GMRCRIX | Live Cricket</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

  <a class="logo" href="index.html">
    GMR<span>CRIX</span>
  </a>

  <nav>
  <a href="index.html">Home</a>
  <a href="teams.html">Teams</a>
    <a href="#live">Live</a>

    <a href="#upcoming">Upcoming</a>

    <a href="#history">History</a>

    <a href="admin.html">Admin</a>

  </nav>

</header>


<main class="container">

  <section class="card">

    <div class="live">
      ● LIVE CRICKET
    </div>

    <h1>GMRCRIX Tournament</h1>

    <p class="muted">
      Live scores, scorecards, match history and ball-by-ball commentary.
    </p>

  </section>


  <section id="live">

    <h2>🔴 Live Matches</h2>

    <div id="liveList" class="list"></div>

  </section>


  <section id="upcoming">

    <h2>📅 Upcoming Matches</h2>

    <div id="upcomingList" class="list"></div>

  </section>


  <section id="history">

    <h2>🏏 Match History</h2>

    <p class="muted">
      Completed matches and previous scorecards.
    </p>

    <div id="completedList" class="list"></div>

  </section>


  <section id="cancelled">

    <h2>❌ Cancelled Matches</h2>

    <div id="cancelledList" class="list"></div>

  </section>

</main>


<script type="module" src="js/index.js"></script>

</html>
